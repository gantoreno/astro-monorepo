name: Deploy PR preview to Vercel

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: read

# Serialize updates to each PR alias; different PRs still deploy independently.
concurrency:
  group: vercel-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  VERCEL_CLI_VERSION: "59.11.7"
  ASTRO_TELEMETRY_DISABLED: "1"
  PR_BRANCH: ${{ github.head_ref }}

defaults:
  run:
    shell: bash

jobs:
  docs:
    # Forks and Dependabot do not receive the Vercel repository secrets.
    if: >-
      github.event.action != 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/docs
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both jobs build the same PR merge commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment secrets
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN repository secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID repository secret}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_DOCS_PROJECT_ID repository secret}"
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --git-branch="$PR_BRANCH" --token="$VERCEL_TOKEN"
      - name: Check Vercel root directory
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const project = JSON.parse(readFileSync(".vercel/project.json", "utf8"));
          const root = project.settings?.rootDirectory;
          if (root && root !== "." && root !== "./") {
            throw new Error(`Clear Root Directory in this Vercel project's settings (currently ${root}). CI already runs inside the app directory.`);
          }
          JS
      - name: Build docs
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy docs
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Check docs is publicly accessible
        env:
          DOCS_URL: ${{ steps.deploy.outputs.url }}
        run: |
          status="$(curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' --max-time 30 "$DOCS_URL/docs")" || true
          if [[ "$status" != "200" ]]; then
            echo "::error::Docs returned HTTP $status after retries. Check its routes and Deployment Protection; the deployment URL must be public for the marketing proxy."
            exit 1
          fi

  marketing:
    needs: docs
    permissions:
      contents: read
      deployments: write
      pull-requests: read
    environment:
      name: preview-pr-${{ github.event.pull_request.number }}
      url: ${{ steps.alias.outputs.url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/marketing
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_MARKETING_PROJECT_ID }}
      DOCS_URL: ${{ needs.docs.outputs.url }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Both jobs build the same PR merge commit.
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Check deployment secrets
        run: |
          : "${VERCEL_TOKEN:?Set the VERCEL_TOKEN repository secret}"
          : "${VERCEL_ORG_ID:?Set the VERCEL_ORG_ID repository secret}"
          : "${VERCEL_PROJECT_ID:?Set the VERCEL_MARKETING_PROJECT_ID repository secret}"
      - name: Install Vercel CLI
        run: npm install --global "vercel@$VERCEL_CLI_VERSION"
      - name: Point marketing at this run's docs deployment
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const url = new URL(process.env.DOCS_URL);
          if (url.protocol !== "https:" || url.username || url.password || url.pathname !== "/" || url.search || url.hash) {
            throw new Error("Expected a public HTTPS docs deployment origin");
          }
          const path = "vercel.json";
          const config = JSON.parse(readFileSync(path, "utf8"));
          for (const source of ["/docs", "/docs/:path*"]) {
            const rule = config.rewrites.find((rewrite) => rewrite.source === source);
            if (!rule) throw new Error(`Missing rewrite for ${source}`);
            rule.destination = `${url.origin}${source}`;
          }
          writeFileSync(path, JSON.stringify(config, null, 2) + "\n");
          JS
      - name: Pull preview settings
        run: vercel pull --yes --environment=preview --git-branch="$PR_BRANCH" --token="$VERCEL_TOKEN"
      - name: Check Vercel root directory
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          const project = JSON.parse(readFileSync(".vercel/project.json", "utf8"));
          const root = project.settings?.rootDirectory;
          if (root && root !== "." && root !== "./") {
            throw new Error(`Clear Root Directory in this Vercel project's settings (currently ${root}). CI already runs inside the app directory.`);
          }
          JS
      - name: Build marketing
        run: vercel build --token="$VERCEL_TOKEN"
      - name: Deploy marketing
        id: deploy
        run: |
          url="$(vercel deploy --prebuilt --yes --token="$VERCEL_TOKEN")"
          printf 'url=%s\n' "$url" >> "$GITHUB_OUTPUT"
      - name: Check marketing and proxied docs
        env:
          MARKETING_URL: ${{ steps.deploy.outputs.url }}
        run: |
          for path in / /about /docs /docs/getting-started; do
            status="$(curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' --max-time 30 "$MARKETING_URL$path")" || true
            if [[ "$status" != "200" ]]; then
              echo "::error::Marketing route $path returned HTTP $status instead of 200."
              exit 1
            fi
          done
      - name: Update permanent PR preview URL
        id: alias
        env:
          MARKETING_URL: ${{ steps.deploy.outputs.url }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY_ID: ${{ github.repository_id }}
        run: |
          # Do not replace the alias with an old rerun or a closed PR's deployment.
          node --input-type=module <<'JS'
          const { GITHUB_REPOSITORY, GH_TOKEN, PR_NUMBER, PR_HEAD_SHA } = process.env;
          const response = await fetch(`https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}`, {
            headers: { Authorization: `Bearer ${GH_TOKEN}`, Accept: "application/vnd.github+json" },
          });
          if (!response.ok) throw new Error(`Cannot check the PR: HTTP ${response.status}`);
          const pr = await response.json();
          if (pr.state !== "open" || pr.head.sha !== PR_HEAD_SHA) {
            throw new Error("This preview is outdated or the PR is closed; keeping the existing preview URL unchanged.");
          }
          JS
          # Repository ID avoids collisions with similarly named projects in other repos.
          host="marketing-pr-$PR_NUMBER-$REPOSITORY_ID.vercel.app"
          vercel alias set "$MARKETING_URL" "$host" --scope "$VERCEL_ORG_ID" --token="$VERCEL_TOKEN"
          printf 'url=https://%s\n' "$host" >> "$GITHUB_OUTPUT"
          printf 'Preview: https://%s\nDocumentation: https://%s/docs\n' "$host" "$host" >> "$GITHUB_STEP_SUMMARY"
