name: Deploy production to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Finish each docs/marketing pair before starting another production release.
concurrency:
  group: cloudflare-production
  cancel-in-progress: false

env:
  ASTRO_TELEMETRY_DISABLED: "1"
  CLOUDFLARE_WRANGLER_VERSION: "4.127.1"
  REPOSITORY_ID: ${{ github.repository_id }}

defaults:
  run:
    shell: bash

jobs:
  docs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install workspace packages
        run: bun install --frozen-lockfile
      - name: Test Cloudflare deployment lifecycle
        run: bun test tests/cloudflare.test.js
      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
      - name: Build docs
        run: bun run build:docs
      - name: Prepare docs production deployment
        id: target
        uses: actions/github-script@v8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const lifecycle = require("./.github/scripts/cloudflare.cjs");
            const target = await lifecycle.deploymentTarget({
              appName: "docs",
              production: true,
              repositoryId: process.env.REPOSITORY_ID,
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: process.env.CLOUDFLARE_API_TOKEN,
            });
            lifecycle.prepare({ appName: "docs", preview: false });
            core.setOutput("command", target.command);
            core.setOutput("url", target.url);
      - name: Deploy docs production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.CLOUDFLARE_WRANGLER_VERSION }}
          packageManager: bun
          command: ${{ steps.target.outputs.command }}
      - name: Check docs production
        env:
          DOCS_URL: ${{ steps.target.outputs.url }}
        run: |
          status="$(curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' --max-time 30 "$DOCS_URL/docs")" || true
          if [[ "$status" != "200" ]]; then
            echo "::error::Docs production returned HTTP $status instead of 200."
            exit 1
          fi
          printf 'Docs production: %s/docs\n' "$DOCS_URL" >> "$GITHUB_STEP_SUMMARY"

  marketing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - name: Install workspace packages
        run: bun install --frozen-lockfile
      - name: Check deployment secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          : "${CLOUDFLARE_API_TOKEN:?Set the CLOUDFLARE_API_TOKEN repository secret}"
          : "${CLOUDFLARE_ACCOUNT_ID:?Set the CLOUDFLARE_ACCOUNT_ID repository secret}"
      - name: Build marketing
        run: bun run build:marketing
      - name: Prepare marketing production deployment
        id: target
        uses: actions/github-script@v8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        with:
          script: |
            const lifecycle = require("./.github/scripts/cloudflare.cjs");
            const target = await lifecycle.deploymentTarget({
              appName: "marketing",
              production: true,
              repositoryId: process.env.REPOSITORY_ID,
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: process.env.CLOUDFLARE_API_TOKEN,
            });
            lifecycle.prepare({
              appName: "marketing",
              docsOrigin: target.docsOrigin,
              preview: false,
            });
            core.setOutput("command", target.command);
            core.setOutput("url", target.url);
            core.setOutput("docs-origin", target.docsOrigin);
      - name: Deploy marketing production
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: ${{ env.CLOUDFLARE_WRANGLER_VERSION }}
          packageManager: bun
          command: ${{ steps.target.outputs.command }}
      - name: Check marketing routes
        env:
          MARKETING_URL: ${{ steps.target.outputs.url }}
          DOCS_ORIGIN: ${{ steps.target.outputs.docs-origin }}
        run: |
          for path in / /about; do
            status="$(curl --silent --show-error --fail --retry 6 --retry-all-errors --retry-delay 5 --output /dev/null --write-out '%{http_code}' --max-time 30 "$MARKETING_URL$path")" || true
            if [[ "$status" != "200" ]]; then
              echo "::error::Marketing route $path returned HTTP $status instead of 200."
              exit 1
            fi
          done
          printf 'Marketing production: %s\nDocs origin: %s\n' "$MARKETING_URL" "$DOCS_ORIGIN" >> "$GITHUB_STEP_SUMMARY"
