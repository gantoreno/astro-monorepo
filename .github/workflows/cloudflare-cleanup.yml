name: Clean up Cloudflare PR preview

on:
  pull_request_target:
    branches: [main]
    types: [closed]

permissions:
  contents: read
  pull-requests: write

# Shared with cloudflare-preview.yml; let an active upload finish first.
concurrency:
  group: cloudflare-preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Load lifecycle code from the trusted default branch, never from the PR.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Remove tagged preview versions
        uses: actions/github-script@v8
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REPOSITORY_ID: ${{ github.repository_id }}
        with:
          script: |
            const lifecycle = require("./.github/scripts/cloudflare.cjs");
            async function requireClosed() {
              const { data: pr } = await github.rest.pulls.get({
                ...context.repo,
                pull_number: context.issue.number,
              });
              if (pr.state !== "closed") {
                throw new Error("The PR was reopened; leaving its preview versions unchanged.");
              }
            }
            await requireClosed();
            const deleted = await lifecycle.deletePreviewVersions({
              repositoryId: process.env.REPOSITORY_ID,
              prNumber: context.issue.number,
              accountId: process.env.CLOUDFLARE_ACCOUNT_ID,
              apiToken: process.env.CLOUDFLARE_API_TOKEN,
              requireClosed,
            });
            await requireClosed();
            const marker = "<!-- cloudflare-pr-preview -->";
            const comments = await github.paginate(github.rest.issues.listComments, {
              ...context.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment =>
              comment.user?.login === "github-actions[bot]" &&
              comment.body?.includes(marker)
            );
            if (existing) {
              await github.rest.issues.updateComment({
                ...context.repo,
                comment_id: existing.id,
                body: `${marker}\n**Cloudflare preview removed.** Reopening this PR creates new versions at the same address.`,
              });
            }
            await core.summary
              .addRaw(`Deleted ${deleted.marketing} marketing and ${deleted.docs} docs preview versions.\n`)
              .write();
