# Select apps/docs as this Netlify project's package directory.
[build]
  base = "/"
  command = "bun run build:docs"
  publish = "apps/docs/dist"

[build.environment]
  BUN_VERSION = "1.3.10"
  NODE_VERSION = "24"

[build.processing.html]
  pretty_urls = false

# Convenience when opening the docs site's own domain directly.
[[redirects]]
  from = "/"
  to = "/docs"
  status = 302
